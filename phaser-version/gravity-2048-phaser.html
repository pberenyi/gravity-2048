<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gravity 2048 — Phaser Version</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #11131a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            gap: 20px;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        h1 {
            color: #f4f5f7;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin: 0;
        }
        .game-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            width: 100%;
        }
        #game {
            border: 2px solid #343b4c;
            border-radius: 15px;
            box-shadow: 0 20px 60px #0008;
            flex-shrink: 0;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
            min-width: 200px;
        }
        .ui-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #343b4c;
            border-radius: 10px;
            padding: 15px;
        }
        .score-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .score-label {
            color: #aeb4c2;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .score-value {
            color: #f4f5f7;
            font-size: 24px;
            font-weight: 700;
        }
        .next-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .next-label {
            color: #aeb4c2;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #nextPreview {
            background: #0a0d13;

            border-radius: 8px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .help-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .help-title {
            color: #aeb4c2;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .help-text {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.5;
        }
        .key {
            display: inline-block;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 12px;
            font-weight: 600;

            .game-wrapper {
                flex-direction: column;
                gap: 20px;

                width: 100%;
                max-width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
            }
            .ui-section {
                flex: 1;
                min-width: 150px;
            }
            h1 {
                font-size: 24px;
            }
        }

<body>
<div class="container">
    <h1>Gravity 2048</h1>
    <div class="game-wrapper">
        <div id="game"></div>
        <div class="sidebar">
            <div class="ui-section score-section">
                <div class="score-item">
                    <span class="score-label">Score</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">Best</span>
                    <span class="score-value" id="best">0</span>
                </div>
            </div>
            <div class="ui-section next-section">
                <div class="next-label">Next Piece</div>
                <div id="nextPreview"></div>
            </div>
            <div class="ui-section help-section">
                <div class="help-title">Controls</div>
                <div class="help-text">
                    <div><span class="key">←</span> <span class="key">→</span> Move</div>
                    <div><span class="key">↓</span> Soft drop</div>
                    <div><span class="key">Space</span> Hard drop</div>
                    <div><span class="key">X</span> Rotate CW</div>
                    <div><span class="key">Z</span> Rotate CCW</div>
                    <div><span class="key">R</span> Restart</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// Gravity 2048 — Phaser Game Logic & Rendering
// ============================================================

// ========== Constants & Configuration ==========
const BOARD_WIDTH = 10;
const BOARD_HEIGHT = 20;
const FALL_INTERVAL = 600; // ms between gravity steps

// Animation timings
const ANIMATION_TIMINGS = {
    MERGE: 65,
    MERGE_PAUSE: 90,
    CLEAR: 170,
    CLEAR_PAUSE: 110,
    SPAWN: 130
};

// Color palette for tile values
const TILE_COLORS = {
    2: 0xd9f99d,
    4: 0xbef264,
    8: 0xfde68a,
    16: 0xfbbf24,
    32: 0xfb923c,
    64: 0xf97316,
    128: 0xf43f5e,
    256: 0xe879f9,
    512: 0xc084fc,
    1024: 0x818cf8,
    2048: 0x60a5fa,
    4096: 0x22d3ee
};

const TEXT_COLORS = {
    light: 0x111111,
    dark: 0xffffff
};

// Tetromino shapes
const SHAPES = {
    I: [[0, 1], [1, 1], [2, 1], [3, 1]],
    O: [[1, 0], [2, 0], [1, 1], [2, 1]],
    T: [[1, 0], [0, 1], [1, 1], [2, 1]],
    S: [[1, 0], [2, 0], [0, 1], [1, 1]],
    Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
    J: [[0, 0], [0, 1], [1, 1], [2, 1]],
    L: [[2, 0], [0, 1], [1, 1], [2, 1]]
};

// ========== Game State (pure logic, no Phaser) ==========
class GameLogic {
    constructor() {
        this.grid = [];
        this.current = null;
        this.nextType = null;
        this.nextValue = null;
        this.score = 0;
        this.best = Number(localStorage.getItem('gravity2048-best') || 0);
        this.running = false;
        this.generation = 0;
        this.cascadeClearCount = 0;
        this.maxBoardValue = 2;
        this.fallTimer = null;
        this.callbacks = {}; // render, lock, merge, clear, etc.
    }

    // Register callback functions for rendering updates
    on(event, callback) {
        if (!this.callbacks[event]) this.callbacks[event] = [];
        this.callbacks[event].push(callback);
    }

    emit(event, ...args) {
        if (this.callbacks[event]) {
            this.callbacks[event].forEach(cb => cb(...args));
        }
    }

    // Tetromino operations
    static randomType() {
        const types = Object.keys(SHAPES);
        return types[Math.floor(Math.random() * types.length)];
    }

    randomValue() {
        const levels = [];
        for (let v = 2; v <= this.maxBoardValue; v *= 2) levels.push(v);
        const weights = levels.map((_, i) => Math.pow(0.5, i));
        const total = weights.reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        for (let i = 0; i < levels.length; i++) {
            r -= weights[i];
            if (r <= 0) return levels[i];
        }
        return levels[levels.length - 1];
    }

    makePiece(type, value) {
        return { type, value, rotation: 0, x: 3, y: 0 };
    }

    // Get absolute cell positions for a piece
    cells(piece, rotation = piece.rotation, px = piece.x, py = piece.y) {
        let out = SHAPES[piece.type].map(([x, y]) => [x, y]);
        if (piece.type !== 'O') {
            for (let r = 0; r < rotation % 4; r++) {
                out = out.map(([x, y]) => [3 - y, x]);
            }
        }
        const minX = Math.min(...out.map(c => c[0]));
        const minY = Math.min(...out.map(c => c[1]));
        return out.map(([x, y]) => [x - minX + px, y - minY + py]);
    }

    // Check collision with grid/bounds
    collides(piece, dx = 0, dy = 0, rotation = piece.rotation) {
        for (const [x, y] of this.cells(piece, rotation, piece.x + dx, piece.y + dy)) {
            if (x < 0 || x >= BOARD_WIDTH || y < 0 || y >= BOARD_HEIGHT) return true;
            if (this.grid[y]?.[x] !== null) return true;
        }
        return false;
    }

    // Start/restart game
    newGame() {
        this.generation++;
        this.grid = Array.from({ length: BOARD_HEIGHT }, () => Array(BOARD_WIDTH).fill(null));
        this.score = 0;
        this.cascadeClearCount = 0;
        this.maxBoardValue = 2;
        this.running = true;
        this.nextType = GameLogic.randomType();
        this.nextValue = this.randomValue();
        this.spawn();
        this.emit('render');
        this.scheduleFall();
    }

    // Promote next to current, spawn next
    spawn() {
        this.current = this.makePiece(this.nextType, this.nextValue);
        this.nextType = GameLogic.randomType();
        this.nextValue = this.randomValue();
        if (this.collides(this.current)) {
            this.endGame();
            return;
        }
        this.emit('spawn', this.nextType, this.nextValue);
    }

    // Attempt to move piece
    tryMove(dx, dy) {
        if (!this.current || this.collides(this.current, dx, dy)) return false;
        this.current.x += dx;
        this.current.y += dy;
        return true;
    }

    // Player move (locks on failed downward move)
    move(dx, dy) {
        if (!this.running || !this.current) return false;
        if (this.tryMove(dx, dy)) {
            this.emit('render');
            return true;
        }
        if (dy === 1) this.lockCurrent();
        return false;
    }

    // Rotate with wall kicks (SRS-style)
    rotate(dir = 1) {
        if (!this.running || !this.current || this.current.type === 'O') return;
        const target = (this.current.rotation + dir + 4) % 4;
        const kicks = [
            [0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0],
            [0, -1], [-1, -1], [1, -1]
        ];
        for (const [kx, ky] of kicks) {
            if (!this.collides(this.current, kx, ky, target)) {
                this.current.rotation = target;
                this.current.x += kx;
                this.current.y += ky;
                this.emit('render');
                return true;
            }
        }
        return false;
    }

    // Hard drop to bottom
    hardDrop() {
        if (!this.running || !this.current) return;
        let distance = 0;
        while (this.tryMove(0, 1)) distance++;
        this.score += distance * 2;
        this.lockCurrent();
    }

    // Lock piece into grid
    async lockCurrent() {
        if (!this.running || !this.current) return;
        const gen = this.generation;
        const p = this.current;
        this.current = null;

        const newCells = new Set();
        for (const [x, y] of this.cells(p)) {
            if (y < 0 || y >= BOARD_HEIGHT || x < 0 || x >= BOARD_WIDTH) {
                this.endGame();
                return;
            }
            this.grid[y][x] = p.value;
            newCells.add(`${x},${y}`);
        }

        this.emit('render');
        await this.resolveBoard(newCells, gen, true);
        if (!this.running || this.generation !== gen) return;

        this.spawn();
        this.emit('render');
        this.scheduleFall();
    }

    // Schedule automatic gravity
    scheduleFall() {
        clearInterval(this.fallTimer);
        this.fallTimer = setInterval(() => {
            if (!this.running || !this.current) return;
            if (!this.tryMove(0, 1)) this.lockCurrent();
            else this.emit('render');
        }, FALL_INTERVAL);
    }

    // Main resolution: merges -> clears -> cascade
    async resolveBoard(activeCells, gen, allowGroupDrop = true) {
        this.cascadeClearCount = 0;

        while (true) {
            const hadMerges = await this.resolveVerticalMerges(activeCells, gen, allowGroupDrop);
            allowGroupDrop = false;
            if (this.generation !== gen || !this.running) return;
            if (hadMerges) {
                this.emit('render');
                await this.sleep(ANIMATION_TIMINGS.MERGE_PAUSE);
                if (this.generation !== gen || !this.running) return;
            }

            const rows = this.findClearRows();
            if (!rows.length && !hadMerges) break;

            if (rows.length) {
                this.cascadeClearCount++;
                const raw = rows.reduce((sum, r) => sum + this.grid[r].reduce((a, v) => a + (v || 0), 0), 0);
                const multiplier = Math.max(1, this.cascadeClearCount);
                this.score += raw * multiplier;

                this.emit('clearRows', rows);
                await this.sleep(ANIMATION_TIMINGS.CLEAR);
                if (this.generation !== gen || !this.running) return;

                activeCells = this.computeFallenCellsFromGrid(rows);
                this.removeRowsWithCollapse(rows);
                this.emit('render');
                await this.sleep(ANIMATION_TIMINGS.CLEAR_PAUSE);
                if (this.generation !== gen || !this.running) return;
            }
        }

        if (this.cascadeClearCount > 1) {
            this.emit('cascade', this.cascadeClearCount);
        }
        this.updateScore();
    }

    // Vertical merge pass
    async resolveVerticalMerges(activeCells, gen, allowGroupDrop = false) {
        const toMerge = [];
        for (let y = BOARD_HEIGHT - 2; y >= 0; y--) {
            for (let x = 0; x < BOARD_WIDTH; x++) {
                const upper = this.grid[y][x];
                const lower = this.grid[y + 1][x];
                if (upper === null || lower === null || upper !== lower) continue;
                const upperIsActive = activeCells.has(`${x},${y}`);
                const lowerIsActive = activeCells.has(`${x},${y + 1}`);
                if (upperIsActive !== lowerIsActive) {
                    toMerge.push([x, y]);
                }
            }
        }

        if (!toMerge.length) return false;

        const consumed = new Set();
        for (const [x, y] of toMerge) {
            const key = `${x},${y}`;
            const keyBelow = `${x},${y + 1}`;
            if (consumed.has(key) || consumed.has(keyBelow)) continue;
            if (this.grid[y][x] === null || this.grid[y + 1][x] === null) continue;

            this.grid[y + 1][x] = this.grid[y][x] * 2;
            this.grid[y][x] = null;
            consumed.add(key);
            consumed.add(keyBelow);
            activeCells.delete(key);
            activeCells.delete(keyBelow);
            this.score += this.grid[y + 1][x];
            if (this.grid[y + 1][x] > this.maxBoardValue) this.maxBoardValue = this.grid[y + 1][x];

            this.emit('merge', x, y + 1, this.grid[y + 1][x]);
        }

        this.emit('render');
        await this.sleep(ANIMATION_TIMINGS.MERGE);
        if (this.generation !== gen || !this.running) return false;

        // Group drop
        if (allowGroupDrop && activeCells.size > 0) {
            let remaining = [...activeCells].map(k => k.split(',').map(Number));
            while (remaining.length > 0 && remaining.every(
                ([cx, cy]) => cy + 1 < BOARD_HEIGHT && (this.grid[cy + 1][cx] === null || activeCells.has(`${cx},${cy + 1}`))
            )) {
                for (const [cx, cy] of remaining.sort((a, b) => b[1] - a[1])) {
                    this.grid[cy + 1][cx] = this.grid[cy][cx];
                    this.grid[cy][cx] = null;
                    activeCells.delete(`${cx},${cy}`);
                    activeCells.add(`${cx},${cy + 1}`);
                }
                remaining = [...activeCells].map(k => k.split(',').map(Number));
                this.emit('render');
                await this.sleep(ANIMATION_TIMINGS.MERGE);
                if (this.generation !== gen || !this.running) return false;
            }
        }

        // Chain merge
        for (const [cx, cy] of [...activeCells].map(k => k.split(',').map(Number)).sort((a, b) => b[1] - a[1])) {
            let mergeY = cy;
            while (mergeY + 1 < BOARD_HEIGHT && this.grid[mergeY][cx] !== null &&
                   this.grid[mergeY + 1][cx] === this.grid[mergeY][cx] &&
                   !activeCells.has(`${cx},${mergeY + 1}`)) {
                this.grid[mergeY + 1][cx] = this.grid[mergeY][cx] * 2;
                this.grid[mergeY][cx] = null;
                this.score += this.grid[mergeY + 1][cx];
                if (this.grid[mergeY + 1][cx] > this.maxBoardValue) this.maxBoardValue = this.grid[mergeY + 1][cx];
                activeCells.delete(`${cx},${mergeY}`);
                mergeY++;
                while (mergeY + 1 < BOARD_HEIGHT && this.grid[mergeY + 1][cx] === null) {
                    this.grid[mergeY + 1][cx] = this.grid[mergeY][cx];
                    this.grid[mergeY][cx] = null;
                    mergeY++;
                }
                this.emit('merge', cx, mergeY, this.grid[mergeY][cx]);
                this.emit('render');
                await this.sleep(ANIMATION_TIMINGS.MERGE);
                if (this.generation !== gen || !this.running) return false;
            }
        }

        return true;
    }

    computeFallenCellsFromGrid(clearedRows) {
        const result = new Set();
        const clearedSet = new Set(clearedRows);
        for (let y = 0; y < BOARD_HEIGHT; y++) {
            if (clearedSet.has(y)) continue;
            const drop = clearedRows.filter(r => r > y).length;
            if (drop === 0) continue;
            for (let x = 0; x < BOARD_WIDTH; x++) {
                if (this.grid[y][x] !== null) {
                    result.add(`${x},${y + drop}`);
                }
            }
        }
        return result;
    }

    findClearRows() {
        const rows = [];
        for (let y = 0; y < BOARD_HEIGHT; y++) {
            if (this.grid[y].every(v => v !== null)) rows.push(y);
        }
        return rows;
    }

    removeRowsWithCollapse(rows) {
        const clearSet = new Set(rows);
        const next = Array.from({ length: BOARD_HEIGHT }, () => Array(BOARD_WIDTH).fill(null));
        let writeY = BOARD_HEIGHT - 1;
        for (let y = BOARD_HEIGHT - 1; y >= 0; y--) {
            if (clearSet.has(y)) continue;
            for (let x = 0; x < BOARD_WIDTH; x++) {
                next[writeY][x] = this.grid[y][x];
            }
            writeY--;
        }
        this.grid = next;
    }

    updateScore() {
        if (this.score > this.best) {
            this.best = this.score;
            localStorage.setItem('gravity2048-best', this.best);
            this.emit('bestUpdated', this.best);
        }
        this.emit('scoreUpdated', this.score);
    }

    endGame() {
        this.running = false;
        clearInterval(this.fallTimer);
        this.emit('gameOver', this.score, this.best);
    }

    sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
}

// ========== Phaser Scene ==========
class Gravity2048Scene extends Phaser.Scene {
    constructor() {
        super({ key: 'Gravity2048' });
        this.logic = new GameLogic();
        this.sprites = {}; // { 'x,y': sprite }
        this.cellSize = 0;
        this.boardOffsetX = 0;
        this.boardOffsetY = 0;
    }

    create() {
        // Calculate cell size to fit 20x10 board responsively
        const maxWidth = Math.min(this.cameras.main.width - 40, 500);
        const maxHeight = Math.min(this.cameras.main.height - 40, 740);
        const cellSizeFromWidth = maxWidth / BOARD_WIDTH;
        const cellSizeFromHeight = maxHeight / BOARD_HEIGHT;
        this.cellSize = Math.floor(Math.min(cellSizeFromWidth, cellSizeFromHeight));

        const boardWidth = this.cellSize * BOARD_WIDTH;
        const boardHeight = this.cellSize * BOARD_HEIGHT;

        this.boardOffsetX = (this.cameras.main.width - boardWidth) / 2;
        this.boardOffsetY = (this.cameras.main.height - boardHeight) / 2;

        // Register game callbacks
        this.logic.on('render', () => this.render());
        this.logic.on('spawn', (type, value) => this.showNextPreview(type, value));
        this.logic.on('merge', (x, y, value) => this.animateMerge(x, y, value));
        this.logic.on('clearRows', (rows) => this.animateClearRows(rows));
        this.logic.on('scoreUpdated', (score) => this.updateScoreUI(score));
        this.logic.on('bestUpdated', (best) => this.updateBestUI(best));
        this.logic.on('gameOver', (score, best) => this.showGameOver(score, best));
        this.logic.on('cascade', (count) => this.showCascadeMessage(count));

        // Input handling
        this.input.keyboard.on('keydown', (e) => this.handleKeyPress(e));

        // Start game
        this.logic.newGame();
        this.updateScoreUI(this.logic.score);
        this.updateBestUI(this.logic.best);
    }

    handleKeyPress(event) {
        const key = event.key.toLowerCase();
        if (key === 'arrowleft') this.logic.move(-1, 0);
        else if (key === 'arrowright') this.logic.move(1, 0);
        else if (key === 'arrowdown') this.logic.move(0, 1);
        else if (key === 'arrowup' || key === 'x') this.logic.rotate(1);
        else if (key === 'z') this.logic.rotate(-1);
        else if (key === ' ') {
            event.preventDefault();
            this.logic.hardDrop();
        } else if (key === 'r') this.logic.newGame();
    }

    render() {
        // Clear old sprites
        Object.values(this.sprites).forEach(sprite => sprite.destroy());
        this.sprites = {};

        // Draw background grid
        this.drawBackgroundGrid();

        // Draw settled tiles
        for (let y = 0; y < BOARD_HEIGHT; y++) {
            for (let x = 0; x < BOARD_WIDTH; x++) {
                if (this.logic.grid[y][x] !== null) {
                    this.drawTile(x, y, this.logic.grid[y][x]);
                }
            }
        }

        // Draw falling piece
        if (this.logic.current) {
            for (const [x, y] of this.logic.cells(this.logic.current)) {
                this.drawTile(x, y, this.logic.current.value, true);
            }
        }
    }

    drawBackgroundGrid() {
        const graphics = this.make.graphics({ x: 0, y: 0, add: false });
        graphics.fillStyle(0x090b10, 1);
        graphics.fillRect(
            this.boardOffsetX - 5,
            this.boardOffsetY - 5,
            BOARD_WIDTH * this.cellSize + 10,
            BOARD_HEIGHT * this.cellSize + 10
        );
        graphics.generateTexture('gridBg', BOARD_WIDTH * this.cellSize + 10, BOARD_HEIGHT * this.cellSize + 10);
        graphics.destroy();

        const bg = this.add.image(this.boardOffsetX - 5, this.boardOffsetY - 5, 'gridBg');
        bg.setOrigin(0, 0);
        bg.setDepth(-1);
    }

    drawTile(x, y, value, isFalling = false) {
        const posX = this.boardOffsetX + x * this.cellSize;
        const posY = this.boardOffsetY + y * this.cellSize;

        const color = TILE_COLORS[value] || TILE_COLORS[4096];
        const textColor = value >= 64 ? TEXT_COLORS.dark : TEXT_COLORS.light;

        // Background rectangle
        const tile = this.add.rectangle(posX + this.cellSize / 2, posY + this.cellSize / 2, this.cellSize - 4, this.cellSize - 4, color, 1);
        tile.setStrokeStyle(2, 0xffffff28);
        tile.setDepth(isFalling ? 2 : 1);

        // Text
        const text = this.add.text(posX + this.cellSize / 2, posY + this.cellSize / 2, value.toString(), {
            fontSize: `${Math.max(12, this.cellSize * 0.45)}px`,
            fontStyle: 'bold',
            color: `#${textColor.toString(16).padStart(6, '0')}`
        });
        text.setOrigin(0.5, 0.5);
        text.setDepth(isFalling ? 2 : 1);

        if (isFalling) {
            tile.setAlpha(0.8);
            text.setAlpha(0.8);
        }

        const key = `${x},${y}`;
        this.sprites[key] = tile;
        this.sprites[`${key}-text`] = text;
    }

    animateMerge(x, y, value) {
        const key = `${x},${y}`;
        if (this.sprites[key]) {
            this.tweens.add({
                targets: this.sprites[key],
                scale: 1.1,
                duration: 100,
                yoyo: true
            });
        }
    }

    animateClearRows(rows) {
        rows.forEach(y => {
            for (let x = 0; x < BOARD_WIDTH; x++) {
                const key = `${x},${y}`;
                if (this.sprites[key]) {
                    this.tweens.add({
                        targets: [this.sprites[key], this.sprites[`${key}-text`]],
                        scale: 0.2,
                        alpha: 0,
                        duration: ANIMATION_TIMINGS.CLEAR,
                        ease: 'Quad.easeIn'
                    });
                }
            }
        });
    }

    showNextPreview(type, value) {
        const preview = document.getElementById('nextPreview');
        preview.innerHTML = '';

        // Calculate cell size for preview (4x4 grid)
        const previewSize = 4;
        const availableSize = preview.offsetWidth;
        const previewCellSize = Math.floor((availableSize - 20) / previewSize);

        // Create SVG for preview
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', availableSize);
        svg.setAttribute('height', preview.offsetHeight);
        svg.setAttribute('viewBox', `0 0 ${availableSize} ${preview.offsetHeight}`);

        // Get piece cells
        const piece = this.logic.makePiece(type, value);
        const cells = this.logic.cells(piece);

        // Find bounds
        const xs = cells.map(c => c[0]);
        const ys = cells.map(c => c[1]);
        const minX = Math.min(...xs);
        const minY = Math.min(...ys);
        const maxX = Math.max(...xs);
        const maxY = Math.max(...ys);
        const width = maxX - minX + 1;
        const height = maxY - minY + 1;

        // Center in preview
        const offsetX = (availableSize - width * previewCellSize) / 2;
        const offsetY = (preview.offsetHeight - height * previewCellSize) / 2;

        const color = TILE_COLORS[value];
        const colorHex = '#' + color.toString(16).padStart(6, '0');

        for (const [x, y] of cells) {
            const px = offsetX + (x - minX) * previewCellSize;
            const py = offsetY + (y - minY) * previewCellSize;

            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', px);
            rect.setAttribute('y', py);
            rect.setAttribute('width', previewCellSize - 2);
            rect.setAttribute('height', previewCellSize - 2);
            rect.setAttribute('fill', colorHex);
            rect.setAttribute('rx', '4');
            svg.appendChild(rect);
        }

        preview.appendChild(svg);
    }

    updateScoreUI(score) {
        document.getElementById('score').textContent = score.toLocaleString();
    }

    updateBestUI(best) {
        document.getElementById('best').textContent = best.toLocaleString();
    }

    showGameOver(score, best) {
        const text = `Final Score: ${score.toLocaleString()}\nBest: ${best.toLocaleString()}`;
        this.add.text(this.cameras.main.width / 2, this.cameras.main.height / 2, text, {
            fontSize: '32px',
            color: '#f4f5f7',
            align: 'center'
        }).setOrigin(0.5, 0.5).setDepth(10);

        this.add.text(this.cameras.main.width / 2, this.cameras.main.height / 2 + 80, 'Press R to restart', {
            fontSize: '16px',
            color: '#7dd3fc',
            align: 'center'
        }).setOrigin(0.5, 0.5).setDepth(10);
    }

    showCascadeMessage(count) {
        const text = this.add.text(this.cameras.main.width / 2, 100, `Cascade ×${count}!`, {
            fontSize: '28px',
            color: '#7dd3fc',
            fontStyle: 'bold'
        }).setOrigin(0.5, 0.5).setDepth(10);

        this.tweens.add({
            targets: text,
            alpha: 0,
            duration: 1000,
            delay: 500,
            onComplete: () => text.destroy()
        });
    }
}

// ========== Phaser Game Config ==========
const config = {
    type: Phaser.AUTO,
    parent: 'game',
    width: window.innerWidth < 900 ? Math.min(window.innerWidth - 40, 500) : 500,
    height: Math.min(window.innerHeight - 120, 740),
    scene: Gravity2048Scene,
    render: {
        pixelArt: true,
        antialias: false
    }
};

const game = new Phaser.Game(config);
</script>
